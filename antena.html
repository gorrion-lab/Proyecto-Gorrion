<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Escuelas con Huertos - Proyecto GORRIÓN</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="CSS/estilosantena.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <div class="container"> <!-- contenedor principal -->

    <!-- ENCABEZADO -->
    <header>
      <div class="logo-izq">
        <img src="Imagenes/logo-universidad.png" alt="UPAtl">
      </div>

      <div class="titulo">
        <h1>ANTENA</h1>
      </div>

      <div class="logo-der">
        <img src="Imagenes/logo-proyecto.png" alt="Proyecto GORRIÓN">
      </div>
    </header>

    <!-- Botón menú hamburguesa (móvil) -->
    <button class="menu-toggle" onclick="toggleMenu()">☰ Menú</button>

    <!-- Menú -->
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="que-es-gorrion.html">¿Qué es GORRIÓN?</a></li>
        <li><a href="antena.html" class="activo">Antena</a></li>
        <li><a href="vinculos.html">Vínculos Gorrión</a></li>
        <li><a href="eventos.html">Eventos y Jornadas</a></li>
        <li><a href="semillero.html">Semillero de lectura</a></li>
        <li><a href="nido.html">Nido de aprendizaje</a></li>
        <li><a href="voces.html">Voces Gorrión</a></li>
        <li><a href="acceso.html">Acceso</a></li>
      </ul>
    </nav>

    <!-- Mapa -->
    <div id="map"></div>

  </div> <!-- fin contenedor -->

  <!-- FOOTER -->
  <footer>
    © 2025 Proyecto Gorrión - Universidad Politécnica de Atlautla
  </footer>

  <script>
    // Función menú hamburguesa
    function toggleMenu() {
      const nav = document.querySelector('nav ul');
      nav.classList.toggle('activo');
    }

    // Inicializar mapa
    var map = L.map('map').setView([19.03, -98.82], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var escuelas = [
      { nombre: "Climatología de Atlautla", municipio: "Atlautla", coords: [19.035155236732237, -98.7878873906034], archivo: "atlautla.html" },
      { nombre: "Escuela Preparatoria Oficial No. 50", municipio: "Ecatzingo", coords: [18.96227283483901, -98.73928974738551], archivo: "ecatzingo.html" },
      { nombre: "Escuela Preparatoria Oficial No. 177", municipio: "Ozumba", coords: [19.036332108887727, -98.79229255583213], archivo: "Ozumba.html" },
      { nombre: "Centro de Bachillerato Tecnológico Tepetlixpa", municipio: "Tepetlixpa", coords: [19.018482862623365, -98.8226903430049], archivo: "tepetlixpa.html" },
      { nombre: "CBT Dr Carlos Sosa Moss", municipio: "Juchitepec", coords: [19.102157905541322, -98.88744597806611], archivo: "juchitepec.html" }
    ];

    var iconoMascota = L.icon({
      iconUrl: 'Imagenes/mascota.png',
      iconSize: [70, 70],
      iconAnchor: [35, 70],
      popupAnchor: [0, -75]
    });

    escuelas.forEach(function(escuela) {
      L.marker(escuela.coords, { icon: iconoMascota }).addTo(map)
        .bindPopup(`
          <div class="popup-card">
            <img src="Imagenes/mascota.png" alt="Mascota" class="popup-img">
            <h3>${escuela.nombre}</h3>
            <p><b>Municipio:</b> ${escuela.municipio}</p>
            <button onclick="window.location.href='${escuela.archivo}'">Saber más</button>
          </div>
        `);
    });

    // Ajuste dinámico del mapa según altura
    function ajustarMapa() {
      const headerHeight = document.querySelector('header').offsetHeight;
      const menuHeight = document.querySelector('.menu-toggle').offsetHeight;
      const footerHeight = document.querySelector('footer').offsetHeight;
      const mapDiv = document.getElementById('map');
      mapDiv.style.height = (window.innerHeight - headerHeight - menuHeight - footerHeight) + 'px';
    }

    window.addEventListener('resize', ajustarMapa);
    window.addEventListener('load', ajustarMapa);

  </script>
</body>
</html>
